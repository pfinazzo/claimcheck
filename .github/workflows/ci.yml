name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # The claude extra puts the anthropic SDK on the path so mypy can check the Claude provider.
        run: pip install -e ".[dev,claude]"
      - name: Lint
        run: ruff check
      - name: Typecheck
        run: mypy
      - name: Test
        run: pytest
      - name: Verify the ledger
        run: claimcheck verify-ledger
      - name: Verify the ledger only grew
        if: github.event_name == 'pull_request'
        run: claimcheck verify-ledger --base origin/${{ github.base_ref }}

  desk:
    name: Desk (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Test
        # One test launches a real Electron window to take a screenshot, so it needs a virtual
        # display, and the runner has no setuid sandbox helper for Chromium to use.
        run: cd app && npm ci && xvfb-run -a npm test
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
