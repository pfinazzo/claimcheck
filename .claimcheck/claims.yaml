    confidence: 0.85
    criteria: [3]
    files: ["app/src/lib/claude-cli.ts"]
    kill_condition: "obs: in a scratch repo whose SessionStart and UserPromptSubmit hooks touch marker files, run claude -p with Desk's propose arguments and ANTHROPIC_BASE_URL=http://127.0.0.1:9; the markers appear without --setting-sources user and do not appear with it"
    verified_by:
      - "obs: ran exactly that probe on 2026-10-28; all three markers without the flag, none with it"

