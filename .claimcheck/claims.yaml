# claimcheck claims file: one entry per thing the author asserts about this diff.
version: 1
author: "claude-code/claude-opus-5-5"
base: "main"
claims:
  - id: c1
    claim: "Every `claude -p` call from the claude-cli provider runs in a new folder from tempfile.TemporaryDirectory that is empty when claude starts. If that folder would sit inside any git repo, including the one being checked, the call raises ProviderError before claude starts and the folder is removed"
    confidence: 0.95
    criteria: [1]
    files: ["src/claimcheck/providers/claude_cli.py"]
    kill_condition: "test: tests/test_claude_cli_folder.py::test_each_call_starts_in_a_new_empty_folder_outside_the_repo and test_a_temp_variable_pointing_into_the_repo_stops_the_call_before_claude_starts"
    verified_by:
      - "cmd: python -m pytest -q tests/test_claude_cli_folder.py (15 passed)"
      - "obs: the three temp-variable tests fail without the inside-a-repo check; the first claimcheck run refuted the version without it"

  - id: c2
    claim: "Two calls get two different folders"
    confidence: 0.95
    criteria: [2]
    files: ["src/claimcheck/providers/claude_cli.py"]
    kill_condition: "test: tests/test_claude_cli_folder.py::test_two_calls_never_share_a_folder"
    verified_by:
      - "cmd: python -m pytest -q tests/test_claude_cli_folder.py"

  - id: c3
    claim: "The folder is removed when the call ends: after a reply, a non-zero exit, a timeout, and an unexpected exception. On Windows a removal error is ignored rather than hiding the real result, so a folder could be left behind there"
    confidence: 0.85
    criteria: [3, 4]
    files: ["src/claimcheck/providers/claude_cli.py"]
    kill_condition: "test: test_the_folder_is_gone_after_a_call_that_worked, test_the_folder_is_gone_after_a_failure_or_a_timeout and test_the_folder_is_gone_when_starting_claude_raises_something_unexpected"
    verified_by:
      - "cmd: python -m pytest -q tests/test_claude_cli_folder.py"

  - id: c4
    claim: "TEMP no longer decides on its own where claude runs: config.read_temp_dir and TEMP_ENV are removed, and TEMP unset no longer means the repo. The temp variables (TMPDIR, TEMP, TMP) still choose where Python makes the folder, so a sandbox can move it. If any of them points inside a repo, the call fails instead of running there"
    confidence: 0.95
    criteria: [1, 5, 6]
    files: ["src/claimcheck/providers/claude_cli.py", "src/claimcheck/config.py"]
    kill_condition: "test: tests/test_claude_cli_folder.py::test_with_temp_unset_the_checker_still_runs_outside_the_repo and test_a_temp_variable_pointing_into_the_repo_stops_the_call_before_claude_starts[TMPDIR, TEMP, TMP]"
    verified_by:
      - "cmd: python -m pytest -q tests/test_claude_cli_folder.py"
      - "cmd: grep -rn read_temp_dir src tests finds nothing"

  - id: c5
    claim: "If the empty folder cannot be made, the call raises ProviderError 'could not make an empty folder for the claude CLI to run in: <reason>' and claude is never started. There is no fallback folder"
    confidence: 0.95
    criteria: [6]
    files: ["src/claimcheck/providers/claude_cli.py"]
    kill_condition: "test: tests/test_claude_cli_folder.py::test_no_empty_folder_means_an_error_and_claude_never_starts"
    verified_by:
      - "cmd: python -m pytest -q tests/test_claude_cli_folder.py"

  - id: c6
    claim: "The claude command line carries --safe-mode and `--tools \"\"`, and no longer carries --disallowedTools"
    confidence: 0.97
    criteria: [7, 8]
    files: ["src/claimcheck/providers/claude_cli.py"]
    kill_condition: "test: tests/test_claude_cli_folder.py::test_claude_runs_with_safe_mode_and_every_tool_off and tests/test_init_onboarding.py::test_provider_sends_the_prompt_on_stdin_with_tools_off"
    verified_by:
