  - id: c7
    claim: "A repo's CLAUDE.md, CLAUDE.local.md and .claude/settings.json hooks no longer reach the checker. Shown with the real Claude Code 2.1.311; a later CLI could change what --safe-mode covers"
    confidence: 0.85
