    claim: "Every `claude -p` run Desk starts gets `--setting-sources user`, because it is in the shared BASE_ARGS that runClaude puts on every launch. Propose, implement and the connection test all go through runClaude"
    confidence: 0.95
    criteria: [1]
    files: ["app/src/lib/claude-cli.ts"]
    kill_condition: "test: app/test/claude-cli.test.ts 'propose, implement and the connection test each start claude with --setting-sources user, so a repo's own hooks are not loaded'"
    verified_by:
      - "cmd: cd app && npm test (224 tests, 222 pass, 2 skipped)"
      - "obs: the same test fails with the fix set aside"

  - id: c2
