    confidence: 0.95
    criteria: [2]
    files: ["app/src/lib/claude-cli.ts"]
    kill_condition: "test: app/test/claude-cli.test.ts 'sign-in is not a claude session, so it does not get --setting-sources'"
    verified_by:
